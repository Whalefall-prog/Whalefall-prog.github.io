# 站点基础信息
title: Whalefall Blog
description: >-
  Whalefall 的安全学习笔记，记录 CTF、Pwn 与二进制安全相关内容。
url: "https://whalefall-prog.github.io"
# 仓库是项目页，访问路径带仓库名；若改名为 <用户名>.github.io 或绑定自定义域名，请将 baseurl 置空
baseurl: "/Whalefall-blog.github.io"
lang: zh-CN
timezone: Asia/Shanghai

author: Whalefall

# 主题（GitHub Pages 原生支持 minima）
theme: minima
minima:
  skin: classic
  social_links:
    - { platform: github, user_url: "https://github.com/Whalefall-prog" }

show_excerpts: true
header_pages:
  - about.md

# 插件（均在 GitHub Pages 白名单内）
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 文章固定链接
permalink: /:year/:month/:day/:title/

# Markdown 与代码高亮
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 不参与构建的文件
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
